name: Publish to Google Play

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  publish:
    name: Build, sign and upload to the internal testing track
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Decode Upload Key
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEY" ]; then
            echo "::error::Add the ANDROID_SIGNING_KEY secret (base64 of the upload keystore)."
            exit 1
          fi
          echo "$ANDROID_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build Signed App Bundle
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Offset keeps every CI build above the version code inherited from upstream.
        run: ./gradlew :app:bundleRelease -PversionCode=$((1000 + GITHUB_RUN_NUMBER))

      # The very first bundle must be uploaded by hand in Play Console; download it from here.
      - uses: actions/upload-artifact@v4
        with:
          name: release.aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        if: env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: se.undersphere.killersudoku
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
